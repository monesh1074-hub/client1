<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141C2E" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Divine Murugan Vel & Lotus Crest Symbol -->
  <g filter="url(#goldGlow)">
    <!-- Aura Rays -->
    <path d="M256 70 L256 90 M256 422 L256 442 M70 256 L90 256 M422 256 L442 256 M125 125 L140 140 M372 372 L387 387 M125 387 L140 372 M372 125 L387 140" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Sacred Vel Blade -->
    <path d="M256 100 C275 145 305 185 305 240 C305 275 285 300 256 315 C227 300 207 275 207 240 C207 185 237 145 256 100 Z" fill="url(#goldGrad)" />
    
    <!-- Inner Spear Inlay Detail -->
    <path d="M256 120 C268 155 288 190 288 235 C288 258 274 275 256 288 C238 275 224 258 224 235 C224 190 244 155 256 120 Z" fill="#0A0E17" />
    
    <!-- Central Sacred Flame/Gem -->
    <path d="M256 160 C263 185 272 205 272 225 C272 240 265 250 256 256 C247 250 240 240 240 225 C240 205 249 185 256 160 Z" fill="url(#goldGrad)" />

    <!-- Shaft -->
    <rect x="250" y="310" width="12" height="110" rx="4" fill="url(#goldGrad)"/>
    <circle cx="256" cy="425" r="8" fill="url(#goldGrad)"/>

    <!-- Lotus Base Pedestal -->
    <path d="M190 350 C210 330 230 330 256 345 C282 330 302 330 322 350 C300 370 275 375 256 370 C237 375 212 370 190 350 Z" fill="url(#goldGrad)" opacity="0.9"/>
  </g>
</svg>
