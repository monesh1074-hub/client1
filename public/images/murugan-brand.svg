  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bgGradBrand)" stroke="url(#goldGradBrand)" stroke-width="6"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGradBrand)" stroke-width="2" stroke-dasharray="6 6"/>

